<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>UniBot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1b2b;
      color: white;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      text-align: center;
      padding: 12px;
      background: #081422;
      font-size: 18px;
      font-weight: bold;
    }

    #chat {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .msg {
      padding: 10px;
      margin: 5px 0;
      border-radius: 10px;
      max-width: 80%;
    }

    .user {
      background: #2d6cdf;
      align-self: flex-end;
    }

    .bot {
      background: #1e293b;
      align-self: flex-start;
    }

    footer {
      display: flex;
      padding: 10px;
      background: #081422;
    }

    input {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 5px;
    }

    button {
      margin-left: 10px;
      padding: 10px;
      background: green;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<header>🤖 UniBot</header>

<div id="chat"></div>

<footer>
  <input id="input" placeholder="Escribe tu pregunta..." />
  <button id="btn">Enviar</button>
</footer>

<script>
const input = document.getElementById("input");
const chat = document.getElementById("chat");
const button = document.getElementById("btn");

button.addEventListener("click", send);
input.addEventListener("keypress", function(e) {
  if (e.key === "Enter") send();
});

async function send() {
  const text = input.value.trim();
  if (!text) return;

  // Usuario
  const userMsg = document.createElement("div");
  userMsg.className = "msg user";
  userMsg.textContent = text;
  chat.appendChild(userMsg);

  input.value = "";

  // Bot (cargando)
  const botMsg = document.createElement("div");
  botMsg.className = "msg bot";
  botMsg.textContent = "Escribiendo...";
  chat.appendChild(botMsg);

  chat.scrollTop = chat.scrollHeight;

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        messages: [{ role: "user", content: text }]
      })
    });

    const data = await res.json();
    botMsg.textContent = data.reply || "Sin respuesta";

  } catch (error) {
    botMsg.textContent = "Error conectando con el servidor";
  }

  chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
