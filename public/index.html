<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>UniBot</title>
</head>

<body style="background:#0f172a; color:white; font-family:Arial; margin:0; padding:0;">

  <h2 style="text-align:center; padding:10px;">🤖 UniBot</h2>

  <!-- CHAT -->
  <div id="chat" style="
    height:70vh;
    overflow:auto;
    padding:10px;
    border-top:1px solid #333;
    border-bottom:1px solid #333;
  "></div>

  <!-- INPUT -->
  <div style="display:flex; padding:10px; gap:5px;">
    <input id="input" placeholder="Escribe tu pregunta..."
      style="flex:1; padding:10px; border-radius:5px; border:none;" />
    
    <button onclick="sendMessage()"
      style="padding:10px; background:#22c55e; border:none; color:white; border-radius:5px;">
      Enviar
    </button>
  </div>

  <!-- SCRIPT -->
  <script>
    const chat = document.getElementById("chat");

    function addMessage(text, sender) {
      const div = document.createElement("div");

      div.style.margin = "10px";
      div.style.padding = "10px";
      div.style.borderRadius = "10px";
      div.style.maxWidth = "80%";

      if (sender === "user") {
        div.style.background = "#2563eb";
        div.style.marginLeft = "auto";
      } else {
        div.style.background = "#16a34a";
        div.style.marginRight = "auto";
      }

      div.innerText = text;

      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById("input");
      const text = input.value;

      if (!text) return;

      addMessage(text, "user");
      input.value = "";

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            messages: [
              {
                role: "user",
                content: text
              }
            ]
          })
        });

        const data = await res.json();

        console.log("Respuesta IA:", data);

        if (data.reply) {
          addMessage(data.reply, "bot");
        } else {
          addMessage("❌ Error: " + JSON.stringify(data), "bot");
        }

      } catch (error) {
        console.error(error);
        addMessage("❌ Error de conexión", "bot");
      }
    }
  </script>

</body>
</html>
