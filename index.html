<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>UniBot</title>
  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      display: flex;
      flex-direction: column;
      height: 100vh;
      margin: 0;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .user {
      text-align: right;
      margin: 5px;
      color: #38bdf8;
    }

    .bot {
      text-align: left;
      margin: 5px;
      color: #a3e635;
    }

    #inputArea {
      display: flex;
      padding: 10px;
      background: #1e293b;
    }

    input {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 5px;
    }

    button {
      margin-left: 10px;
      padding: 10px;
      background: #22c55e;
      border: none;
      color: white;
      border-radius: 5px;
    }
  </style>
</head>
<body>

<div id="chat"></div>

<div id="inputArea">
  <input id="input" placeholder="Escribe tu pregunta..." />
  <button onclick="sendMessage()">Enviar</button>
</div>

<script src="app.js"></script>

</body>
</html>
